<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your FoodExpress account and start ordering delicious food today.">
    <title>Register — FoodExpress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">🍔</span>
            <span>FoodExpress</span>
        </a>
        <button class="hamburger" onclick="toggleNav()" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <!-- REGISTER FORM -->
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-icon">✨</div>
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join FoodExpress and start ordering</p>

            <div class="form-group">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <input type="email" id="registerEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="Create a password" required>
            </div>

            <div class="btn-group">
                <button class="btn-primary btn-full" onclick="register()">🚀 Create Account</button>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
                <br><br>
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
