<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <h1>Register</h1>

    <div class="food-card">

        <input
            type="text"
            id="registerName"
            placeholder="Enter Name"
        >

        <input
            type="email"
            id="registerEmail"
            placeholder="Enter Email"
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Enter Password"
        >

        <button onclick="register()">

            Register

        </button>

        <br><br>

        <a href="login.html">

            <button>

                Login
            </button>

        </a>

    </div>

    <script src="app.js"></script>

</body>

</html>
