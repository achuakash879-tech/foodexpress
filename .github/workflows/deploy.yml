name: Deploy FoodExpress

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/myapp
            git pull origin main
            cd backend
            npm install
            pm2 restart foodexpress || pm2 start app.js --name foodexpress
            cd ../frontend
            pm2 restart frontend-server || true
