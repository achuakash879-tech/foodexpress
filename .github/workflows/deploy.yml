name: Deploy FoodExpress

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/foodexpress
            git pull origin main
            cd backend
            npm install
            pm2 restart foodexpress
            sudo cp -r ~/foodexpress/frontend/* /var/www/html/
            sudo systemctl restart nginx
